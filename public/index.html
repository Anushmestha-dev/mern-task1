<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <header class="header">
      <h1>Item Hub</h1>
    </header>

  
    <div class="card form-card">
      <form id="itemForm" novalidate>
      
        <div class="form-group">
          <label for="itemName">Name</label>
          <input 
            type="text" 
            id="itemName" 
            name="name" 
            placeholder="Enter item name (e.g. Notebook)"
            autocomplete="off"
          />
          <span class="error-msg" id="nameError"></span>
        </div>

        
        <div class="form-group">
          <label for="itemPrice">Price (₹)</label>
          <input 
            type="number" 
            id="itemPrice" 
            name="price" 
            step="any" 
            min="0"
            placeholder="Enter price in ₹ (e.g. 250)"
          />
          <span class="error-msg" id="priceError"></span>
        </div>

      
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    
    <div class="card table-card">
      <div class="table-responsive">
        <table class="items-table" id="itemsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody">
            
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
